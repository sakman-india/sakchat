<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAK CHAT</title>
    <style>
        html, body { height: 100%; height: 100dvh; margin: 0; padding: 0; overflow: hidden; background: #ece5dd; font-family: Arial, sans-serif; }

        /* 👑 LOGIN PAGE MAGIC HEART */
        .top-magic-heart {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            font-size: 32px; cursor: pointer;
            animation: heartAnimChat 1.5s infinite alternate ease-in-out;
            user-select: none; -webkit-user-select: none;
            z-index: 1000; padding: 10px; line-height: 1;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes heartAnimChat {
            0% { filter: hue-rotate(0deg); transform: translateX(-50%) scale(1); }
            100% { filter: hue-rotate(360deg); transform: translateX(-50%) scale(1.25); }
        }

        /* 👑 CHAT PAGE MAGIC HEART */
        .chat-magic-heart {
            font-size: 26px; cursor: pointer;
            animation: heartAnimChatInline 1.5s infinite alternate ease-in-out;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin-right: 15px;
        }
        @keyframes heartAnimChatInline {
            0% { filter: hue-rotate(0deg); transform: scale(1); }
            100% { filter: hue-rotate(360deg); transform: scale(1.25); }
        }

        #loginBgContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #loginBgContainer img, #loginBgContainer video { width: 100%; height: 100%; object-fit: cover; }
        #loginBox { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; max-width: 350px; width: 85%; background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 35px 20px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255, 255, 255, 0.4); box-sizing: border-box; transition: top 0.3s ease; }
        #chatBox { display: none; width: 100%; height: 100%; flex-direction: column; position: relative; z-index: 2; background: #ece5dd; }
        .dancing-couple { font-size: 55px; margin-bottom: 25px; animation: bounce 1.5s infinite alternate ease-in-out; filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.3)); }
        @keyframes bounce { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-15px) scale(1.05); } }

        .login-input { padding: 15px; width: 85%; border: 1px solid rgba(255,255,255,0.6); border-radius: 30px; outline: none; text-align: center; font-size: 16px; margin-bottom: 10px; background: rgba(255, 255, 255, 0.5); color: #222; font-weight: bold; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); box-sizing: border-box; transition: background 0.3s; }
        .login-input::placeholder { color: #ff3366; letter-spacing: 3px; font-size: 20px; font-weight: bold; transform: translateY(3px); }
        .login-btn { margin-top:15px; padding:10px 40px; background: #ff3366; border:none; border-radius:30px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 51, 102, 0.5); transition: transform 0.2s; }
        .login-btn:active { transform: scale(0.95); }
        .animated-heart { display: inline-block; font-size: 30px; animation: pulseHeart 1s infinite; line-height: 1; margin-top: 5px;}
        @keyframes pulseHeart { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        .header { background: #075e54; color: white; padding: 10px 15px; flex-shrink: 0; }
        .header-top { display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; flex: 1; }
        .partner-dp { width: 40px; height: 40px; border-radius: 50%; background: #dfe5e7; margin-right: 12px; object-fit: cover; border: 1px solid #075e54; cursor: pointer; }
        .header-title { font-size: 18px; font-weight: bold; }
        .status-text { font-size: 12px; color: #e1fafd; }
        .icon-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 5px; }
        .dropdown-content { display: none; position: absolute; right: 10px; top: 50px; background: white; min-width: 170px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); z-index: 100; border-radius: 5px; overflow: hidden; }
        .dropdown-content a { color: black; padding: 12px 16px; text-decoration: none; display: block; font-size: 15px; }
        .show { display: block; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; background-color: #e5ddd5; background-size: cover; background-position: center; background-repeat: no-repeat; scroll-behavior: smooth; }
        .date-divider { text-align: center; margin: 15px 0; width: 100%; display: flex; justify-content: center; }
        .date-divider span { background: rgba(225, 250, 253, 0.9); color: #555; padding: 5px 15px; border-radius: 15px; font-size: 12px; font-weight: bold; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .reply-content { background: rgba(0,0,0,0.05); border-left: 4px solid #075e54; padding: 5px 8px; border-radius: 4px; margin-bottom: 5px; font-size: 13px; color: #555; cursor: pointer; }
        .reply-content b { color: #075e54; font-size: 12px; }
        .msg { padding: 8px 10px 4px 10px; margin: 5px 0; border-radius: 10px; max-width: 85%; word-wrap: break-word; font-size: 15px; display: inline-block; position: relative; -webkit-user-select: none; user-select: none; box-shadow: 0 1px 2px rgba(0,0,0,0.15); transition: opacity 0.3s; }
        .my-msg { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 0; }
        .other-msg { background: #fff; align-self: flex-start; border-bottom-left-radius: 0; }
        .deleted-msg { font-style: italic; color: #888; }
        .msg-image { max-width: 100%; border-radius: 8px; margin-top: 5px; margin-bottom: 5px; cursor: pointer; display: block; }
        .doc-msg { display: flex; align-items: center; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 8px; text-decoration: none; color: #333; margin: 5px 0; border: 1px solid rgba(0,0,0,0.1); }
        .doc-icon { font-size: 24px; margin-right: 10px; }
        .doc-name { font-size: 14px; flex: 1; word-break: break-all; margin-right: 10px; }
        .doc-download { font-size: 18px; color: #075e54; }
        .msg-audio { width: 260px; max-width: 100%; height: 50px; margin-top: 5px; outline: none; border-radius: 25px; }
        .audio-name { font-size: 12px; font-weight: bold; color: #075e54; margin-bottom: 5px; word-break: break-all; }
        .loc-msg { display: flex; align-items: center; background: #e1fafd; padding: 12px; border-radius: 8px; text-decoration: none; color: #075e54; margin: 5px 0; border: 1px solid rgba(7, 94, 84, 0.2); }
        .loc-icon { font-size: 24px; margin-right: 10px; color: #ea4335; }
        .loc-text { font-size: 14px; font-weight: bold; }
        @keyframes highlight { from { background: #ffeb3b; } to { background: transparent; } }
        .highlight-msg { animation: highlight 2s ease-out; border-radius: 10px; }
        .role-tag { font-size: 11px; color: #075e54; margin-bottom: 3px; font-weight: bold; display: block; }
        .my-msg .role-tag { color: #054c44; }
        .time-tag { font-size: 10px; color: #888; float: right; margin-top: 5px; margin-left: 10px; display: flex; align-items: center; }
        .tick { margin-left: 4px; font-size: 12px; letter-spacing: -2px;}
        .tick-sent { color: #888; }
        .tick-read { color: #34b7f1; }
        #replyPreview { display: none; background: #f0f0f0; border-left: 5px solid #075e54; padding: 8px 15px; position: relative; }
        #replyPreview b { font-size: 13px; color: #075e54; }
        #replyPreview p { margin: 2px 0; font-size: 14px; color: #444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .close-reply { position: absolute; right: 10px; top: 10px; cursor: pointer; font-weight: bold; }
        #msgInputDiv { display: flex; padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; flex-shrink: 0; align-items: flex-end; }
        #msgInput { flex: 1; padding: 12px 15px; border-radius: 20px; border: none; outline: none; font-size: 15px; resize: none; overflow-y: auto; max-height: 100px; height: 44px; box-sizing: border-box; font-family: Arial, sans-serif; line-height: 20px; }
        #sendBtn { margin-left: 10px; width: 44px; height: 44px; border-radius: 50%; background: #075e54; color: white; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 0; }
        .attach-btn, .mic-btn { background: none; border: none; font-size: 24px; padding: 0 10px; cursor: pointer; height: 44px; display: flex; align-items: center; justify-content: center; }
        .attach-btn { color: #555; margin-right: 5px; }
        .mic-btn { color: #075e54; }
        #cancelRecordBtn { display: none; color: #ff3b30; font-size: 24px; padding: 0 10px; background: none; border: none; cursor: pointer; height: 44px; }
        #recordTimer { display: none; flex: 1; text-align: center; color: #ff3b30; font-weight: bold; align-self: center; font-size: 16px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .attachment-menu { display: none; position: absolute; bottom: 70px; left: 15px; right: 15px; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); grid-template-columns: repeat(3, 1fr); gap: 20px 10px; z-index: 100; justify-items: center; }
        .attachment-menu.show { display: grid; animation: popup 0.2s ease-out; }
        @keyframes popup { from { transform: scale(0.9) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        .attach-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; width: 80px; }
        .attach-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; color: white; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); pointer-events: none; }
        .attach-item span { font-size: 12px; color: #555; text-align: center; pointer-events: none; }
        .bg-gallery { background: linear-gradient(135deg, #bf59c0, #8030c6); } .bg-camera { background: linear-gradient(135deg, #f0506e, #d03050); } .bg-doc { background: linear-gradient(135deg, #5c6bc0, #3f51b5); } .bg-audio { background: linear-gradient(135deg, #ff9800, #f57c00); } .bg-location { background: linear-gradient(135deg, #4caf50, #388e3c); } .bg-sticker { background: linear-gradient(135deg, #ff4081, #c51162); }
        .modal-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 80%; max-width: 300px; text-align: center; }
        .modal-content button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 5px; background: #075e54; color: white; font-size: 16px; }
        #dpViewModal { z-index: 2000; background: rgba(0,0,0,0.9); flex-direction: column; }
        #fullSizeDP { max-width: 90%; max-height: 80vh; object-fit: contain; border-radius: 5px; transition: transform 0.2s; }
        .close-dp-btn { position: fixed; top: 20px; right: 20px; color: white; font-size: 40px; cursor: pointer; font-weight: bold; line-height: 1; z-index: 2001; }
        #stickerMenu { display: none; position: absolute; bottom: 70px; left: 15px; right: 15px; background: white; border-radius: 15px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 10px; z-index: 101; text-align: center; font-size: 30px; max-height: 250px; overflow-y: auto; }
        #stickerMenu.show { display: grid; animation: popup 0.2s ease-out; }
        .sticker-emoji { cursor: pointer; display: flex; justify-content: center; align-items: center; }
        #callScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #075e54; z-index: 9999; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 0; color: white; font-family: Arial, sans-serif; box-sizing: border-box; }
        #callDP { width: 140px; height: 140px; border-radius: 50%; margin-bottom: 20px; border: 4px solid rgba(255,255,255,0.3); object-fit: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        #callName { margin: 0; font-size: 32px; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        #callStatusText { margin: 10px 0; font-size: 18px; opacity: 0.8; letter-spacing: 1px; }
        #callTimer { font-size: 22px; margin-top: 15px; display: none; font-weight: bold; }
        .call-controls { display: flex; gap: 40px; margin-bottom: 40px; }
        .call-btn { border: none; width: 70px; height: 70px; border-radius: 50%; font-size: 28px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .call-btn:active { transform: scale(0.9); }
        #muteBtn { background: rgba(255,255,255,0.2); }
        #cutBtn { background: #ff3b30; transform: rotate(135deg); }
        #cutBtn:active { transform: rotate(135deg) scale(0.9); }

        /* 👑 NEW: Custom Toast Notification Style */
        #customToast {
            visibility: hidden; min-width: 200px; background-color: rgba(0,0,0,0.8); color: #fff;
            text-align: center; border-radius: 30px; padding: 12px 20px; position: fixed;
            z-index: 99999; left: 50%; bottom: 30px; transform: translateX(-50%);
            font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            opacity: 0; transition: opacity 0.3s, bottom 0.3s;
        }
        #customToast.show { visibility: visible; opacity: 1; bottom: 80px; }
    </style>
</head>
<body>

    <div id="customToast">Message</div>

    <div id="loginMagicHeart" class="top-magic-heart" onclick="window.top.location.href='https://sakmusic.xyz';">❤️</div>

    <div id="loginBgContainer"></div>
    <div id="loginBox">
        <div class="dancing-couple">🕺❤️💃</div>
        <input type="password" id="password" class="login-input" placeholder="************" oninput="autoLogin()">
        <br><button onclick="login()" class="login-btn"><span class="animated-heart">🥰</span></button>
    </div>
    
    <div id="callScreen">
        <div style="text-align: center; margin-top: 20px;">
            <img id="callDP" src="">
            <h2 id="callName">Partner</h2>
            <p id="callStatusText">Calling...</p>
            <div id="callTimer">00:00</div>
        </div>
        <div class="call-controls">
            <button id="muteBtn" class="call-btn" onclick="toggleMuteCall()">🎤</button>
            <button id="cutBtn" class="call-btn" onclick="cutCall(true)">📞</button>
        </div>
        <audio id="remoteAudio" autoplay></audio>
    </div>

    <div id="msgModal" class="modal-bg">
        <div class="modal-content">
            <h3 style="color:#075e54; margin-top:0;">Options</h3>
            <button id="btnReply" onclick="prepareReply()">Reply</button>
            <button id="btnCopy" onclick="copyMessage()">Copy</button>
            <button onclick="deleteMsg('me')">Delete for me</button>
            <button id="btnEveryone" onclick="deleteMsg('everyone')">Delete for everyone</button>
            <button onclick="closeModal()" style="background:#ddd; color:black">Cancel</button>
        </div>
    </div>
    <div id="dpViewModal" class="modal-bg" onclick="closeDPView()"><span class="close-dp-btn" onclick="closeDPView()">×</span><img id="fullSizeDP" src=""></div>
    
    <div id="chatBox">
        <div class="header">
            <div class="header-top">
                <div class="user-info">
                    <img id="partnerDP" class="partner-dp" onclick="viewDP()" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23aaa'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
                    <div class="header-title-container">
                        <div class="header-title" id="userRoleTitle">Partner</div>
                        <div id="statusText" class="status-text">Offline</div>
                    </div>
                </div>

                <div class="header-actions" style="display: flex; align-items: center;">
                    <input type="file" id="dpInput" style="display:none" accept="image/*" onchange="uploadDP(this)">
                    <input type="file" id="bgInput" style="display:none" accept="image/*" onchange="uploadWallpaper(this)">
                    <input type="file" id="loginBgInput" style="display:none" accept="image/*,video/*" onchange="uploadGlobalLoginBg(this)">
                    <div class="chat-magic-heart" onclick="window.top.location.href='https://sakmusic.xyz';">❤️</div>
                    <button class="icon-btn" onclick="startCall()">📞</button>
                    <button class="icon-btn" onclick="toggleMenu(event)">⋮</button>
                    <div id="kebabMenu" class="dropdown-content">
                        <a href="#" id="masterLoginBgOption" style="display:none; color:#075e54; font-weight:bold;" onclick="closeAllMenus(); document.getElementById('loginBgInput').click();">Change Login Page Media</a>
                        <a href="#" onclick="closeAllMenus(); changeName();">Change My Name</a>
                        <a href="#" onclick="closeAllMenus(); document.getElementById('dpInput').click();">Change My DP</a>
                        <a href="#" onclick="closeAllMenus(); document.getElementById('bgInput').click();">Change Chat Wallpaper</a>
                        <a href="#" onclick="closeAllMenus(); removeWallpaper();">Remove Chat Wallpaper</a>
                        <a href="#" onclick="closeAllMenus(); clearChat();">Clear Chat</a>
                    </div>
                </div>
            </div>
        </div>
        <div id="messages"></div>
        <div id="attachmentMenu" class="attachment-menu">
            <div class="attach-item" onclick="document.getElementById('chatImageInput').click(); closeAllMenus();"><div class="attach-icon bg-gallery">🖼️</div><span>Gallery</span></div>
            <div class="attach-item" onclick="document.getElementById('chatCameraInput').click(); closeAllMenus();"><div class="attach-icon bg-camera">📷</div><span>Camera</span></div>
            <div class="attach-item" onclick="document.getElementById('chatDocInput').click(); closeAllMenus();"><div class="attach-icon bg-doc">📄</div><span>Document</span></div>
            <div class="attach-item" onclick="document.getElementById('chatAudioInput').click(); closeAllMenus();"><div class="attach-icon bg-audio">🎧</div><span>Audio</span></div>
            <div class="attach-item" onclick="sendLocationMessage(); closeAllMenus();"><div class="attach-icon bg-location">📍</div><span>Location</span></div>
            <div class="attach-item" id="stickerBtn" onclick="toggleStickers(event);"><div class="attach-icon bg-sticker">🏵️</div><span>Sticker</span></div>
        </div>
        <div id="stickerMenu"></div>
        <input type="file" id="chatImageInput" style="display:none" accept="image/*" onchange="sendMediaMessage(this, 'image')">
        <input type="file" id="chatCameraInput" style="display:none" accept="image/*" capture="environment" onchange="sendMediaMessage(this, 'image')">
        <input type="file" id="chatDocInput" style="display:none" onchange="sendDocMessage(this)">
        <input type="file" id="chatAudioInput" style="display:none" accept="audio/*" onchange="sendMediaMessage(this, 'audio')">
        <div id="replyPreview"><span class="close-reply" onclick="cancelReply()">×</span><b id="replyUser">Replying to...</b><p id="replyText">Message text</p></div>
        <div id="msgInputDiv">
            <button id="attachBtn" class="attach-btn" onclick="toggleAttachment(event)">📎</button>
            <textarea id="msgInput" placeholder="Message" rows="1"></textarea>
            <button id="cancelRecordBtn" onclick="cancelRecording()">🗑️</button>
            <div id="recordTimer">🔴 00:00</div>
            <button id="micBtn" class="mic-btn" onclick="startRecording()">🎤</button>
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ transports: ['websocket'], upgrade: false });
        let currentUser = '', savedHistory = [], globalProfiles = null, globalStatus = null;
        let selectedMsg = null, replyTo = null;
        let mediaRecorder, audioChunks = [], isRecording = false, isRecordCancelled = false;
        let recordTimerInterval = null, recordSeconds = 0;
        let peerConn = null, callStream = null, callInterval = null, callSeconds = 0;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // 🧠 LAZY LOADING VARIABLES
        let visibleCount = 50; 

        function showToast(msg) {
            const toastEl = document.getElementById("customToast");
            toastEl.innerText = msg;
            toastEl.className = "show";
            setTimeout(function(){ toastEl.className = toastEl.className.replace("show", ""); }, 3000);

        async function uploadMedia(fileOrBlob, prefix, fileName) {
            const formData = new FormData();
            formData.append('file', fileOrBlob, fileName);
            formData.append('prefix', prefix);
            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.success) return data.url;
            } catch(e) { alert('File upload failed! Check network.'); }
            return null;
        }

        async function sendMediaMessage(input, type) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const originalName = file.name || (type === 'image' ? 'photo.jpg' : 'audio.m4a');
                input.value = '';
                showToast("Sending Media... ⏳");
                const fileUrl = await uploadMedia(file, type === 'image' ? 'img' : 'aud', originalName);
                if(!fileUrl) return;
                const msg = {
                    id: Date.now().toString(), role: currentUser, text: '', time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), date: new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}), status: 'sent', replyTo: replyTo ? replyTo.id : null, replyToRole: replyTo ? replyTo.role : null, replyToText: replyTo ? getReplyTextPreview(replyTo) : null
                };
                if(type === 'image') msg.image = fileUrl;
                if(type === 'audio') { msg.audio = fileUrl; msg.fileName = originalName; msg.isVoiceNote = false; }
                socket.emit('sendMessage', msg);
                cancelReply();
            }
        }

        async function startRecording() {
            if (isRecording) return;
            closeAllMenus();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => { audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    if (isRecordCancelled) return;
                    showToast("Sending Voice Note... ⏳");
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    const now = new Date();
                    const genFileName = `Voice ${String(now.getFullYear()).slice(2)}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}.m4a`;
                    const fileUrl = await uploadMedia(audioBlob, 'aud', genFileName);
                    if(!fileUrl) return;
                    const msg = {
                        id: Date.now().toString(), role: currentUser, text: '', audio: fileUrl,
                        fileName: genFileName, isVoiceNote: true,
                        time: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                        date: now.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}),
                        status: 'sent', replyTo: replyTo ? replyTo.id : null, replyToRole: replyTo ? replyTo.role : null, replyToText: replyTo ? getReplyTextPreview(replyTo) : null
                    };
                    socket.emit('sendMessage', msg);
                    cancelReply();
                };
                mediaRecorder.start();
                isRecording = true;
                isRecordCancelled = false;
                document.getElementById('attachBtn').style.display = 'none';
                document.getElementById('msgInput').style.display = 'none';
                document.getElementById('micBtn').style.display = 'none';
                document.getElementById('cancelRecordBtn').style.display = 'block';
                const timerEl = document.getElementById('recordTimer');
                timerEl.style.display = 'block';
                timerEl.innerText = '🔴 00:00';
                recordSeconds = 0;
                recordTimerInterval = setInterval(() => {
                    recordSeconds++;
                    timerEl.innerText = '🔴 ' + String(Math.floor(recordSeconds / 60)).padStart(2, '0') + ':' + String(recordSeconds % 60).padStart(2, '0');
                }, 1000);
            } catch (err) { alert("Microphone permission denied!"); }
        }

        function cancelRecording() {
            if (!isRecording) return;
            isRecordCancelled = true;
            mediaRecorder.stop();
            if(mediaRecorder.stream) mediaRecorder.stream.getTracks().forEach(t => t.stop());
            resetRecordingUI();
        }

        function stopAndSendRecording() {
            if (!isRecording) return;
            isRecordCancelled = false;
            mediaRecorder.stop();
            if(mediaRecorder.stream) mediaRecorder.stream.getTracks().forEach(t => t.stop());
            resetRecordingUI();
        }

        function resetRecordingUI() {
            isRecording = false;
            clearInterval(recordTimerInterval);
            document.getElementById('attachBtn').style.display = 'flex';
            document.getElementById('msgInput').style.display = 'block';
            document.getElementById('micBtn').style.display = 'flex';
            document.getElementById('cancelRecordBtn').style.display = 'none';
            document.getElementById('recordTimer').style.display = 'none';
            document.getElementById('msgInput').focus();
        }

        function openCallScreen(targetRole, statusMsg) { document.getElementById('callScreen').style.display = 'flex'; document.getElementById('callName').innerText = (globalProfiles && globalProfiles[targetRole] && globalProfiles[targetRole].name) ? globalProfiles[targetRole].name : targetRole; const dpImg = document.getElementById('callDP'); if(globalProfiles && globalProfiles[targetRole] && globalProfiles[targetRole].dp) dpImg.src = globalProfiles[targetRole].dp; else dpImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23aaa'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"; document.getElementById('callStatusText').innerText = statusMsg; document.getElementById('callTimer').style.display = 'none'; callSeconds = 0; clearInterval(callInterval); }

        async function startCall() { if(!currentUser) return; const other = currentUser === 'Master' ? 'Guest' : 'Master'; if(!globalStatus || !globalStatus[other] || !globalStatus[other].online) return showToast("Partner is offline!"); openCallScreen(other, "Calling..."); try { callStream = await navigator.mediaDevices.getUserMedia({ audio: true }); peerConn = new RTCPeerConnection(rtcConfig); callStream.getTracks().forEach(t => peerConn.addTrack(t, callStream)); peerConn.ontrack = e => { document.getElementById('remoteAudio').srcObject = e.streams[0]; }; peerConn.onicecandidate = e => { if(e.candidate) socket.emit('webrtc_ice', { to: other, candidate: e.candidate }); }; const offer = await peerConn.createOffer(); await peerConn.setLocalDescription(offer); socket.emit('webrtc_offer', { to: other, from: currentUser, offer }); } catch(err) { cutCall(true); alert("Microphone permission denied! Cannot make call."); } }

        socket.on('webrtc_offer', async (data) => { const callerName = (globalProfiles && globalProfiles[data.from] && globalProfiles[data.from].name) ? globalProfiles[data.from].name : data.from; if(confirm("📞 Incoming Audio Call from " + callerName + "!\nAccept?")) { openCallScreen(data.from, "Connecting..."); try { callStream = await navigator.mediaDevices.getUserMedia({ audio: true }); peerConn = new RTCPeerConnection(rtcConfig); callStream.getTracks().forEach(t => peerConn.addTrack(t, callStream)); peerConn.ontrack = e => { document.getElementById('remoteAudio').srcObject = e.streams[0]; }; peerConn.onicecandidate = e => { if(e.candidate) socket.emit('webrtc_ice', { to: data.from, candidate: e.candidate }); }; await peerConn.setRemoteDescription(data.offer); const answer = await peerConn.createAnswer(); await peerConn.setLocalDescription(answer); socket.emit('webrtc_answer', { to: data.from, answer }); startCallTimer(); } catch(err) { cutCall(true); alert("Microphone permission denied! Cannot accept call."); } } else { socket.emit('endCall', { to: data.from }); const now = new Date(); socket.emit('sendMessage', { id: Date.now().toString(), role: data.from, text: "📞 Missed Call", time: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), date: now.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}), status: 'sent', replyTo: null, replyToRole: null, replyToText: null }); } });
        socket.on('webrtc_answer', async (data) => { await peerConn.setRemoteDescription(data.answer); startCallTimer(); });
        socket.on('webrtc_ice', async (data) => { if(peerConn) await peerConn.addIceCandidate(data.candidate); });
        socket.on('callEnded', () => { cutCall(false); });

        function startCallTimer() { document.getElementById('callStatusText').innerText = "Connected"; const timerEl = document.getElementById('callTimer'); timerEl.style.display = 'block'; callInterval = setInterval(() => { callSeconds++; timerEl.innerText = String(Math.floor(callSeconds / 60)).padStart(2, '0') + ":" + String(callSeconds % 60).padStart(2, '0'); }, 1000); }
        function cutCall(isInitiator = false) { let finalTime = document.getElementById('callTimer').innerText; let wasConnected = callSeconds > 0; if(peerConn) { peerConn.close(); peerConn = null; } if(callStream) { callStream.getTracks().forEach(t => t.stop()); callStream = null; } document.getElementById('callScreen').style.display = 'none'; clearInterval(callInterval); const other = currentUser === 'Master' ? 'Guest' : 'Master'; if(isInitiator) { socket.emit('endCall', { to: other }); let logText = wasConnected ? "📞 Audio Call (" + finalTime + ")" : "📞 Missed Call"; const now = new Date(); socket.emit('sendMessage', { id: Date.now().toString(), role: currentUser, text: logText, time: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), date: now.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}), status: 'sent', replyTo: null, replyToRole: null, replyToText: null }); } }
        function toggleMuteCall() { if(callStream) { const audioTrack = callStream.getAudioTracks()[0]; audioTrack.enabled = !audioTrack.enabled; document.getElementById('muteBtn').style.background = audioTrack.enabled ? 'rgba(255,255,255,0.2)' : 'rgba(255,0,0,0.5)'; } }

        function toggleMenu(e) { e.stopPropagation(); document.getElementById('kebabMenu').classList.toggle('show'); }
        function toggleAttachment(e) { if(e) e.stopPropagation(); document.getElementById('attachmentMenu').classList.toggle('show'); document.getElementById('stickerMenu').classList.remove('show'); }
        function toggleStickers(e) { if(e) e.stopPropagation(); document.getElementById('attachmentMenu').classList.remove('show'); document.getElementById('stickerMenu').classList.toggle('show'); }

        document.addEventListener('click', function(event) { if (!event.target.matches('.icon-btn')) { document.getElementById('kebabMenu').classList.remove('show'); } const attachMenu = document.getElementById('attachmentMenu'); const stickerMenu = document.getElementById('stickerMenu'); const attachBtn = document.getElementById('attachBtn'); const stickerBtn = document.getElementById('stickerBtn'); if (attachMenu.classList.contains('show') && !attachMenu.contains(event.target) && event.target !== attachBtn) attachMenu.classList.remove('show'); if (stickerMenu.classList.contains('show') && !stickerMenu.contains(event.target) && (!stickerBtn || !stickerBtn.contains(event.target))) stickerMenu.classList.remove('show'); });

        function sendSticker(emoji) { closeAllMenus(); const now = new Date(); const msg = { id: Date.now().toString(), role: currentUser, text: emoji, isSticker: true, time: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), date: now.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}), status: 'sent', replyTo: replyTo ? replyTo.id : null, replyToRole: replyTo ? replyTo.role : null, replyToText: replyTo ? getReplyTextPreview(replyTo) : null }; socket.emit('sendMessage', msg); cancelReply(); }
        function sendLocationMessage() { closeAllMenus(); if ("geolocation" in navigator) { navigator.geolocation.getCurrentPosition(function(position) { const msg = { id: Date.now().toString(), role: currentUser, text: '', location: { lat: position.coords.latitude, lng: position.coords.longitude }, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), date: new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}), status: 'sent', replyTo: replyTo ? replyTo.id : null, replyToRole: replyTo ? replyTo.role : null, replyToText: replyTo ? getReplyTextPreview(replyTo) : null }; socket.emit('sendMessage', msg); cancelReply(); }, function() { alert("Location access denied!"); }); } else { alert("Geolocation not supported."); } }

        function viewDP() { viewFullImage(document.getElementById('partnerDP').src); }
        function viewFullImage(src) { document.getElementById('fullSizeDP').src = src; document.getElementById('dpViewModal').style.display = 'flex'; document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes'); }
        function closeDPView() { document.getElementById('dpViewModal').style.display = 'none'; document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'); }

        function changeName() {
            closeAllMenus();
            const currentName = globalProfiles && globalProfiles[currentUser] ? globalProfiles[currentUser].name : currentUser;
            const newName = prompt("Enter your new Display Name:", currentName);
            if(newName && newName.trim() !== '') {
                socket.emit('updateName', {role: currentUser, name: newName.trim()});
                showToast("Name Updated! 🙂");
            }
        }

        function uploadDP(input) {
            closeAllMenus();
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                showToast("Uploading DP... ⏳");
                reader.onload = (e) => {
                    let currentBg = null;
                    if (globalProfiles && globalProfiles[currentUser] && globalProfiles[currentUser].dp) {
                        try { let parsed = JSON.parse(globalProfiles[currentUser].dp); currentBg = parsed.bg; }
                        catch(err) {}
                    }
                    let myData = { dp: e.target.result, bg: currentBg };
                    socket.emit('updateDP', {role: currentUser, dpData: JSON.stringify(myData)});
                    showToast("DP Updated! 🙂");
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        socket.on('profileUpdate', (p) => { globalProfiles = p; updateDPDisplay(); renderSlice(false); });

        function updateDPDisplay() {
            if (!currentUser) return;
            const other = (currentUser === 'Master' ? 'Guest' : 'Master');

            if (globalProfiles && globalProfiles[other]) {
                let dpSrc = globalProfiles[other].dp;
                let dpUrl = dpSrc;
                if (dpSrc) {
                    try { let parsed = JSON.parse(dpSrc); dpUrl = parsed.dp; } catch(e) { dpUrl = dpSrc; }
                }
                if(dpUrl) { document.getElementById('partnerDP').src = dpUrl; }
                else { document.getElementById('partnerDP').src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23aaa'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"; }
                document.getElementById('userRoleTitle').innerText = globalProfiles[other].name ? globalProfiles[other].name : other;
            }

            let mBg = null, gBg = null;
            if (globalProfiles && globalProfiles['Master'] && globalProfiles['Master'].dp) {
                try { let parsed = JSON.parse(globalProfiles['Master'].dp); if(parsed.bg) mBg = parsed.bg; } catch(e){}
            }
            if (globalProfiles && globalProfiles['Guest'] && globalProfiles['Guest'].dp) {
                try { let parsed = JSON.parse(globalProfiles['Guest'].dp); if(parsed.bg) gBg = parsed.bg; } catch(e){}
            }

            let finalBgUrl = null;
            if (mBg && mBg.ts && gBg && gBg.ts) {
                finalBgUrl = (mBg.ts > gBg.ts) ? mBg.url : gBg.url;
            } else if (mBg && mBg.ts) {
                finalBgUrl = mBg.url;
            } else if (gBg && gBg.ts) {
                finalBgUrl = gBg.url;
            } else {
                if (mBg && typeof mBg === 'string') finalBgUrl = mBg;
                else if (gBg && typeof gBg === 'string') finalBgUrl = gBg;
            }

            const messagesDiv = document.getElementById('messages');
            if (finalBgUrl) {
                messagesDiv.style.backgroundImage = `url('${finalBgUrl}')`;
            } else {
                messagesDiv.style.backgroundImage = 'none';
            }
        }

        socket.on('statusUpdate', (s) => { globalStatus = s; updateStatus(); });

        function updateStatus() {
            if (!currentUser) return;
            const other = (currentUser === 'Master' ? 'Guest' : 'Master');
            const statusDiv = document.getElementById('statusText');

            if (globalStatus && globalStatus[other].online) {
                statusDiv.innerText = 'Online';
            } else if (globalStatus && globalStatus[other].lastSeen) {
                const lastDate = new Date(globalStatus[other].lastSeen);
                const now = new Date();

                const isSameDay = (d1, d2) => d1.getDate() === d2.getDate() && d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear();

                const yesterday = new Date();
                yesterday.setDate(now.getDate() - 1);

                const timeStr = lastDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

                if (isSameDay(lastDate, now)) {
                    statusDiv.innerText = 'last seen today at ' + timeStr;
                } else if (isSameDay(lastDate, yesterday)) {
                    statusDiv.innerText = 'last seen yesterday at ' + timeStr;
                } else {
                    const dateStr = lastDate.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
                    statusDiv.innerText = 'last seen ' + dateStr + ' at ' + timeStr;
                }
            } else {
                statusDiv.innerText = 'Offline';
            }
        }

        socket.on('receiveMessage', (m) => { 
            savedHistory.push(m); 
            
            // Jabe scroll kora thakle autoscroll hobe, na hole hobe na
            const box = document.getElementById('messages');
            const isAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 100;
            
            if(visibleCount < savedHistory.length) visibleCount++; // Notun message asle limit bariye nebe
            
            renderSlice(isAtBottom); 
            
            if(m.role !== currentUser && document.visibilityState === 'visible') socket.emit('markAsRead', currentUser); 
        });

        function formatLinks(text) { if(!text) return ''; const regex = /((?:https?:\/\/|www\.)[^\s]+|\b[a-zA-Z0-9-]+\.[a-zA-Z]{2,}\b(?:\/[^\s]*)?)/gi; let formattedText = text.replace(regex, function(url) { let href = url; if (!href.match(/^https?:\/\//i)) href = 'http://' + href; return `<a href="${href}" target="_blank" style="color: #027eb5; text-decoration: underline;" onclick="event.stopPropagation()">${url}</a>`; }); return formattedText.replace(/\n/g, '<br>'); }
        function getReplyTextPreview(m) { if (m.isSticker) return '🏵️ Sticker'; if (m.image) return '📷 Photo'; if (m.location) return '📍 Location'; if (m.audio) return '🎤 Audio'; if (m.fileName) return '📄 Document'; return m.text; }

        // 🧠 THE LAZY LOADING BRAIN (Replaces old render function)
        function renderSlice(scrollToBottom = false) {
            if (!currentUser) return;
            const box = document.getElementById('messages');
            
            // Puran scroll position ta mone rakha hoche jate page na lafay
            const oldScrollHeight = box.scrollHeight;
            const oldScrollTop = box.scrollTop;

            box.innerHTML = ''; 
            let lastDisplayedDate = '';

            // Sudhu limit moto message dekhabe (Default 50)
            const sliceStartIndex = Math.max(0, savedHistory.length - visibleCount);
            const currentSlice = savedHistory.slice(sliceStartIndex);

            currentSlice.forEach(m => {
                if (m.deletedFor && m.deletedFor.includes(currentUser)) return;
                if (m.date && m.date !== lastDisplayedDate) { const d = document.createElement('div'); d.className = 'date-divider'; const today = new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); d.innerHTML = `<span>${m.date === today ? 'Today' : m.date}</span>`; box.appendChild(d); lastDisplayedDate = m.date; }
                const div = document.createElement('div'); div.id = 'msg-' + m.id; div.className = 'msg ' + (m.role === currentUser ? 'my-msg' : 'other-msg'); if (m.isDeleted) div.classList.add('deleted-msg');
                let timer; div.ontouchstart = () => timer = setTimeout(() => openModal(m), 600); div.ontouchend = () => clearTimeout(timer); div.ontouchmove = () => clearTimeout(timer); div.onmousedown = () => timer = setTimeout(() => openModal(m), 600); div.onmouseup = () => clearTimeout(timer); div.onmouseleave = () => clearTimeout(timer); div.oncontextmenu = (e) => { e.preventDefault(); return false; };
                const senderName = (globalProfiles && globalProfiles[m.role] && globalProfiles[m.role].name) ? globalProfiles[m.role].name : m.role;
                let content = '';
                if (m.replyTo) { const replyToName = (globalProfiles && globalProfiles[m.replyToRole] && globalProfiles[m.replyToRole].name) ? globalProfiles[m.replyToRole].name : m.replyToRole; content += `<div class="reply-content" style="${m.isSticker ? 'background: white;' : ''}" onclick="scrollToMsg('${m.replyTo}')"><b>${replyToName}</b><br>${m.replyToText || 'Attachment'}</div>`; }
                let tickHTML = ''; if (m.role === currentUser && !m.isDeleted) { tickHTML = m.status === 'read' ? `<span class="tick tick-read">✓✓</span>` : `<span class="tick tick-sent">✓✓</span>`; }
                if (m.isSticker && !m.isDeleted) {
                    div.style.background = 'transparent'; div.style.boxShadow = 'none'; div.style.padding = '0';
                    content += `<span class="role-tag" style="background: white; padding: 2px 5px; border-radius: 5px; display:inline-block;">${senderName}</span>`;
                    content += `<div style="font-size: 80px; line-height: 1; margin: 5px 0; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));">${m.text}</div>`;
                    content += `<div class="time-tag" style="background: rgba(255,255,255,0.7); padding: 2px 5px; border-radius: 10px;">${m.time ? m.time : ''} ${tickHTML}</div>`;
                } else {
                    let imgHTML = ''; if (m.image && !m.isDeleted) imgHTML = `<img src="${m.image}" class="msg-image" onclick="viewFullImage('${m.image}')" draggable="false">`;
                    let docHTML = ''; if (m.fileData && !m.isDeleted) docHTML = `<a href="${m.fileData}" download="${m.fileName}" class="doc-msg" onclick="event.stopPropagation()"><span class="doc-icon">📄</span><span class="doc-name">${m.fileName}</span><span class="doc-download">⬇️</span></a>`;
                    let audioHTML = '';
                    if (m.audio && !m.isDeleted) {
                        audioHTML = `<div class="audio-name" style="color:#075e54; font-size:12px; font-weight:bold; margin-bottom:5px;">🎵 ${m.fileName || 'Audio'}</div>
                                                                        <audio controls controlsList="nodownload noplaybackrate" src="${m.audio}" class="msg-audio" onclick="event.stopPropagation()"></audio>`;
                    }
                    let locHTML = ''; if (m.location && !m.isDeleted) locHTML = `<a href="https://www.google.com/maps?q=${m.location.lat},${m.location.lng}" target="_blank" class="loc-msg" onclick="event.stopPropagation()"><span class="loc-icon">📍</span><span class="loc-text">View Location Map</span></a>`;
                    content += `<span class="role-tag">${senderName}</span>${imgHTML}${docHTML}${audioHTML}${locHTML}<span style="white-space: pre-wrap;">${m.isDeleted ? m.text : formatLinks(m.text)}</span><div class="time-tag">${m.time ? m.time : ''} ${tickHTML}</div>`;
                }
                div.innerHTML = content; box.appendChild(div);
            });
            
            if (scrollToBottom) {
                box.scrollTop = box.scrollHeight;
            } else {
                // Jekhane chilen, thik seikhanei page ta theme thakbe
                box.scrollTop = oldScrollTop + (box.scrollHeight - oldScrollHeight);
            }
        }

        function scrollToMsg(id) { const el = document.getElementById('msg-' + id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('highlight-msg'); setTimeout(() => el.classList.remove('highlight-msg'), 2000); } }
        function openModal(m) { selectedMsg = m; document.getElementById('msgModal').style.display = 'flex'; if (m.isDeleted) { document.getElementById('btnReply').style.display = 'none'; document.getElementById('btnCopy').style.display = 'none'; document.getElementById('btnEveryone').style.display = 'none'; } else { document.getElementById('btnReply').style.display = 'block'; document.getElementById('btnEveryone').style.display = (m.role === currentUser ? 'block' : 'none'); if(m.text && m.text.trim() !== '' && !m.isSticker) { document.getElementById('btnCopy').style.display = 'block'; } else { document.getElementById('btnCopy').style.display = 'none'; } } }
        function closeModal() { document.getElementById('msgModal').style.display = 'none'; }
        function copyMessage() { if (selectedMsg && selectedMsg.text) { if(navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(selectedMsg.text).then(() => { showToast("Message copied! 📋"); closeModal(); }); } else { const textArea = document.createElement("textarea"); textArea.value = selectedMsg.text; textArea.style.position = "fixed"; document.body.appendChild(textArea); textArea.focus(); textArea.select(); try { document.execCommand('copy'); showToast("Message copied! 📋"); } catch (err) {} textArea.remove(); closeModal(); } } }
        function prepareReply() { replyTo = selectedMsg; document.getElementById('replyPreview').style.display = 'block'; document.getElementById('replyUser').innerText = 'Replying to ' + ((globalProfiles && globalProfiles[replyTo.role] && globalProfiles[replyTo.role].name) ? globalProfiles[replyTo.role].name : replyTo.role); document.getElementById('replyText').innerText = getReplyTextPreview(replyTo); closeModal(); document.getElementById('msgInput').focus(); }
        function cancelReply() { replyTo = null; document.getElementById('replyPreview').style.display = 'none'; }

        function sendMessage() {
            closeAllMenus();
            if(isRecording) { stopAndSendRecording(); return; }
            const msgInput = document.getElementById('msgInput'); const text = msgInput.value; if (!text.trim()) return;
            socket.emit('sendMessage', { id: Date.now().toString(), role: currentUser, text: text, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), date: new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}), status: 'sent', replyTo: replyTo ? replyTo.id : null, replyToRole: replyTo ? replyTo.role : null, replyToText: replyTo ? getReplyTextPreview(replyTo) : null });
            msgInput.value = ''; msgInput.style.height = '44px'; cancelReply();
        }

        function deleteMsg(type) {
            socket.emit('deleteMessage', {id: selectedMsg.id, type, role: currentUser});
            closeModal();
            const msgEl = document.getElementById('msg-' + selectedMsg.id);
            if (msgEl) {
                if (type === 'me') { msgEl.style.display = 'none'; }
                else if (type === 'everyone') {
                    msgEl.innerHTML = `<span class="role-tag">${currentUser}</span><span style="white-space: pre-wrap; font-style: italic; color: #888;">🚫 This message was deleted</span><div class="time-tag"></div>`;
                    msgEl.classList.add('deleted-msg'); msgEl.style.background = 'transparent'; msgEl.style.boxShadow = 'none';
                }
            }
        }

        function clearChat() { closeAllMenus(); if(confirm("Clear chat for you?")) { socket.emit('clearChat', currentUser); document.getElementById('messages').innerHTML = ''; showToast("Chat Cleared! 🧹"); } }

        let typingTimer; const msgInputField = document.getElementById('msgInput'); msgInputField.addEventListener('input', function() { this.style.height = '44px'; this.style.height = (this.scrollHeight) + 'px'; socket.emit('typing', currentUser); clearTimeout(typingTimer); typingTimer = setTimeout(() => socket.emit('stopTyping', currentUser), 1500); });
        socket.on('userTyping', (r) => { if(r !== currentUser) document.getElementById('statusText').innerText = 'typing...'; });
        socket.on('userStoppedTyping', (r) => { if(r !== currentUser) updateStatus(); });
    </script>
